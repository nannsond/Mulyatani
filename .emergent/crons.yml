crons:
  - name: auto-archive-deliv
    description: "Arsipkan otomatis pesanan pengantaran yang sudah selesai lebih dari 3 hari agar daftar tetap ringkas"
    cron: "0 1 * * *"
    timezone: "Asia/Jakarta"
    endpoint: "{{BASE_URL}}/api/cron/auto-archive-deliveries"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
